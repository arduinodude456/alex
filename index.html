<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprachassistent</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
  }
  .card {
    width: 420px;
    max-width: 92vw;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  p.subtitle { opacity: 0.7; font-size: 0.85rem; margin-top: 0; }

  .settings {
    text-align: left;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    padding: 10px 12px;
    margin: 14px 0;
    font-size: 0.8rem;
  }
  .settings label { display: block; margin-bottom: 4px; opacity: 0.8; }
  .settings input {
    width: 100%;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .settings input::placeholder { color: rgba(255,255,255,0.4); }
  .weather-info {
    font-size: 0.75rem;
    opacity: 0.6;
    margin-top: -4px;
  }

  .mic-btn {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    cursor: pointer;
    margin: 20px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 0 0 rgba(139,92,246,0.6);
  }
  .mic-btn:hover { transform: scale(1.05); }
  .mic-btn.listening {
    animation: pulse 1.4s infinite;
    background: linear-gradient(135deg, #ef4444, #f97316);
  }
  .mic-btn.thinking {
    background: linear-gradient(135deg, #f59e0b, #eab308);
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
    70% { box-shadow: 0 0 0 20px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }

  .status { font-size: 0.85rem; opacity: 0.8; min-height: 20px; margin-bottom: 10px; }

  .log {
    text-align: left;
    max-height: 260px;
    overflow-y: auto;
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    padding: 12px;
    font-size: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    padding: 8px 12px;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.35;
  }
  .user {
    align-self: flex-end;
    background: #6366f1;
    border-bottom-right-radius: 2px;
  }
  .assistant {
    align-self: flex-start;
    background: rgba(255,255,255,0.15);
    border-bottom-left-radius: 2px;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

  .hint { font-size: 0.75rem; opacity: 0.5; margin-top: 14px; }
  details summary { cursor: pointer; opacity: 0.7; font-size: 0.8rem; margin-bottom: 8px; }

  .text-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .text-input-row input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 0.9rem;
  }
  .text-input-row input::placeholder { color: rgba(255,255,255,0.4); }
  .text-input-row button {
    width: 42px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .text-input-row button:hover { filter: brightness(1.1); }
</style>
</head>
<body>

<div class="card">
  <h1>🎙️ Sprachassistent</h1>
  <p class="subtitle">Klicke aufs Mikrofon und sprich einen Befehl</p>

  <details>
    <summary>⚙️ Einstellungen</summary>
    <div class="settings">
      <label for="apiKey">Groq API-Key</label>
      <input type="password" id="apiKey" placeholder="gsk_...">
      <label for="city">Stadt (für Wetter)</label>
      <input type="text" id="city" placeholder="Zwickau" value="Zwickau">
      <label for="voiceSelect">Stimme</label>
      <select id="voiceSelect" style="width:100%; padding:6px 8px; border-radius:6px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.08); color:#fff; font-size:0.85rem;"></select>
    </div>
  </details>

  <div class="weather-info" id="weatherInfo">Wetter wird geladen...</div>

  <button class="mic-btn" id="micBtn">🎤</button>
  <div class="status" id="status">Bereit</div>

  <div class="text-input-row">
    <input type="text" id="textInput" placeholder="Oder hier tippen...">
    <button id="sendBtn">➤</button>
  </div>

  <div class="log" id="log"></div>

  <div class="hint">Frag mich alles – z. B. "Wie ist das Wetter?" oder "Was sollte ich heute anziehen?"</div>
</div>

<script>
const micBtn = document.getElementById('micBtn');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const apiKeyInput = document.getElementById('apiKey');
const cityInput = document.getElementById('city');
const weatherInfoEl = document.getElementById('weatherInfo');

// API-Key lokal merken
apiKeyInput.value = localStorage.getItem('groq_api_key') || '';
apiKeyInput.addEventListener('change', () => {
  localStorage.setItem('groq_api_key', apiKeyInput.value);
});
cityInput.addEventListener('change', () => {
  localStorage.setItem('assistant_city', cityInput.value);
  loadWeather();
});
cityInput.value = localStorage.getItem('assistant_city') || 'Zwickau';

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let currentWeather = null;
let conversationHistory = []; // speichert bis zu 5 Nachrichten-Paare (user+assistant)

// Stimmenauswahl
const voiceSelect = document.getElementById('voiceSelect');
let availableVoices = [];

function loadVoices() {
  const allVoices = window.speechSynthesis.getVoices();
  // Bevorzugt deutsche Stimmen, falls keine vorhanden sind alle anzeigen
  const germanVoices = allVoices.filter(v => v.lang.startsWith('de'));
  availableVoices = germanVoices.length > 0 ? germanVoices : allVoices;

  if (availableVoices.length === 0) return;

  voiceSelect.innerHTML = '';
  availableVoices.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = v.name + (v.lang ? ` (${v.lang})` : '');
    voiceSelect.appendChild(opt);
  });

  const savedVoice = localStorage.getItem('assistant_voice');
  if (savedVoice && availableVoices.some(v => v.name === savedVoice)) {
    voiceSelect.value = savedVoice;
  }
}

voiceSelect.addEventListener('change', () => {
  localStorage.setItem('assistant_voice', voiceSelect.value);
});

// Stimmen laden (bei manchen Browsern erst nach dem Event verfügbar)
loadVoices();
if (window.speechSynthesis.onvoiceschanged !== undefined) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

const weatherCodes = {
  0: 'klarer Himmel', 1: 'überwiegend klar', 2: 'teilweise bewölkt', 3: 'bedeckt',
  45: 'Nebel', 48: 'Reifnebel',
  51: 'leichter Nieselregen', 53: 'Nieselregen', 55: 'starker Nieselregen',
  61: 'leichter Regen', 63: 'Regen', 65: 'starker Regen',
  71: 'leichter Schneefall', 73: 'Schneefall', 75: 'starker Schneefall',
  80: 'Regenschauer', 81: 'kräftige Regenschauer', 82: 'heftige Regenschauer',
  95: 'Gewitter', 96: 'Gewitter mit Hagel', 99: 'starkes Gewitter mit Hagel'
};

async function loadWeather() {
  const city = cityInput.value.trim() || 'Zwickau';
  weatherInfoEl.textContent = 'Wetter wird geladen...';
  try {
    // Geokodierung: Stadtname -> Koordinaten
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=de&format=json`);
    const geoData = await geoRes.json();
    if (!geoData.results || geoData.results.length === 0) {
      weatherInfoEl.textContent = 'Stadt nicht gefunden.';
      return;
    }
    const { latitude, longitude, name } = geoData.results[0];

    // Wetterdaten abrufen
    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);
    const weatherData = await weatherRes.json();

    const cur = weatherData.current;
    const desc = weatherCodes[cur.weather_code] || 'unbekanntes Wetter';

    currentWeather = {
      ort: name,
      temperatur: cur.temperature_2m,
      gefuehlt: cur.apparent_temperature,
      luftfeuchtigkeit: cur.relative_humidity_2m,
      wind: cur.wind_speed_10m,
      beschreibung: desc,
      tagesmax: weatherData.daily.temperature_2m_max[0],
      tagesmin: weatherData.daily.temperature_2m_min[0]
    };

    weatherInfoEl.textContent = `📍 ${name}: ${cur.temperature_2m}°C, ${desc}`;
  } catch (err) {
    weatherInfoEl.textContent = 'Wetter konnte nicht geladen werden.';
    console.error(err);
  }
}

loadWeather();
// Wetter alle 15 Minuten aktualisieren
setInterval(loadWeather, 15 * 60 * 1000);

function addBubble(text, who) {
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function applyStyle(style) {
  if (!style || typeof style !== 'object') return;
  const card = document.querySelector('.card');

  if (style.background) document.body.style.background = style.background;
  if (style.cardBackground) card.style.background = style.cardBackground;
  if (style.accentColor) {
    document.documentElement.style.setProperty('--accent', style.accentColor);
    micBtn.style.background = style.accentColor;
  }
  if (style.textColor) document.body.style.color = style.textColor;
  if (style.fontSize) document.body.style.fontSize = style.fontSize;
  if (style.borderRadius) card.style.borderRadius = style.borderRadius;
}

function speak(text) {
  addBubble(text, 'assistant');
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'de-DE';
  utter.rate = 1;

  const selectedVoiceName = voiceSelect.value;
  const voice = availableVoices.find(v => v.name === selectedVoiceName);
  if (voice) utter.voice = voice;

  window.speechSynthesis.speak(utter);
}

function buildSystemPrompt() {
  let weatherBlock = 'Aktuell liegen keine Wetterdaten vor.';
  if (currentWeather) {
    const w = currentWeather;
    weatherBlock = `Aktuelles Wetter in ${w.ort}: ${w.beschreibung}, ${w.temperatur}°C (gefühlt ${w.gefuehlt}°C), Luftfeuchtigkeit ${w.luftfeuchtigkeit}%, Wind ${w.wind} km/h. Tagesmaximum ${w.tagesmax}°C, Tagesminimum ${w.tagesmin}°C.`;
  }

  return `Du bist ein hilfsbereiter Sprachassistent mit der Fähigkeit, das Aussehen und Verhalten deiner eigenen Web-Oberfläche zu verändern.

Antworte IMMER ausschließlich mit einem einzigen validen JSON-Objekt, ohne Markdown, ohne Codeblöcke, ohne zusätzlichen Text davor oder danach. Format:

{"speech": "Gesprochene Antwort, kurz und natürlich, 1-3 Sätze, keine Sonderzeichen", "style": { ... optional ... }, "script": "optional, JavaScript-Code als String"}

Das "style"-Feld ist optional und wird nur gesetzt, wenn der Nutzer explizit oder implizit eine Änderung des Aussehens wünscht (z.B. "mach den Hintergrund blau", "größere Schrift", "dunkleres Design"). Erlaubte style-Schlüssel (alle optional, nur setzen was gewünscht ist):
- "background": CSS-Farbe oder Gradient für den Seitenhintergrund (z.B. "linear-gradient(135deg, #000, #333)" oder "#1a1a1a")
- "cardBackground": CSS-Farbe/rgba für die Kartenfläche
- "accentColor": Hex-Farbe für Mikrofon-Button und Akzente
- "textColor": Hex-Farbe für den Text
- "fontSize": CSS-Größe für den Basistext (z.B. "18px")
- "borderRadius": CSS-Radius für die Karte (z.B. "8px" oder "40px")

Das "script"-Feld ist optional und wird nur gesetzt, wenn der Nutzer eine Verhaltensänderung, Animation, Interaktion oder eigenen JavaScript-Code wünscht (z.B. "lass die Karte wackeln", "füge einen Konfetti-Effekt hinzu", "schreib mir Code der ein Rechteck zeichnet", "zähle beim Klick einen Counter hoch"). Du KANNST und SOLLST in solchen Fällen echten, direkt ausführbaren JavaScript-Code als String in "script" schreiben - das JSON-Format deiner Antwort hindert dich nicht daran, im "script"-Wert normalen JS-Code unterzubringen. Lehne solche Wünsche niemals ab und behaupte niemals, du könntest keinen Code schreiben. Der Code läuft direkt im Browser mit vollem Zugriff auf "document" und "window". Halte den Code kurz, robust und ohne Endlosschleifen.

Beispiel für eine Anfrage wie "zeichne ein Rechteck":
{"speech": "Ich habe ein Rechteck eingefügt.", "script": "const r = document.createElement('div'); r.style.width='100px'; r.style.height='60px'; r.style.background='#6366f1'; r.style.margin='10px auto'; document.querySelector('.card').appendChild(r);"}

Setze "style" und "script" niemals, wenn keine entsprechende Änderung gewünscht ist.

Wetterdaten (nutze sie nur, wenn relevant für die Frage):
${weatherBlock}`;
}

async function askGroq(userText) {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) {
    speak('Bitte trage zuerst deinen Groq API-Schlüssel in den Einstellungen ein.');
    return;
  }

  try {
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [
          { role: 'system', content: buildSystemPrompt() },
          ...conversationHistory,
          { role: 'user', content: userText }
        ],
        temperature: 0.7,
        max_tokens: 300,
        response_format: { type: 'json_object' }
      })
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`API-Fehler ${response.status}: ${errText}`);
    }

    const data = await response.json();
    const rawAnswer = data.choices[0].message.content.trim();

    let answer = rawAnswer;
    let style = null;
    let script = null;
    try {
      // Falls das Modell versehentlich Codeblock-Markierungen mitschickt, entfernen
      const cleaned = rawAnswer.replace(/^```json\s*|^```\s*|```$/g, '').trim();
      const parsed = JSON.parse(cleaned);
      answer = parsed.speech || rawAnswer;
      style = parsed.style || null;
      script = parsed.script || null;
    } catch (parseErr) {
      // Fallback: falls kein valides JSON, Rohtext als Antwort nutzen
      console.warn('Antwort war kein valides JSON, nutze Rohtext.', parseErr);
    }

    if (style) applyStyle(style);
    if (script) {
      try {
        new Function(script)();
      } catch (scriptErr) {
        console.error('Fehler beim Ausführen des Scripts:', scriptErr);
      }
    }

    // Verlauf aktualisieren: aktuelle Frage + Antwort anhängen
    conversationHistory.push({ role: 'user', content: userText });
    conversationHistory.push({ role: 'assistant', content: answer });
    // Auf die letzten 5 Nachrichten begrenzen (bei Bedarf älteste zuerst entfernen)
    while (conversationHistory.length > 5) {
      conversationHistory.shift();
    }

    speak(answer);
  } catch (err) {
    console.error(err);
    speak('Es gab ein Problem bei der Anfrage an Groq. Prüfe deinen API-Schlüssel.');
  }
}

async function processInput(text) {
  addBubble(text, 'user');
  micBtn.classList.add('thinking');
  statusEl.textContent = 'Denke nach...';
  await askGroq(text);
  micBtn.classList.remove('thinking');
  statusEl.textContent = 'Bereit';
}

if (!SpeechRecognition) {
  statusEl.textContent = 'Spracherkennung wird von diesem Browser nicht unterstützt (am besten Chrome nutzen).';
  micBtn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = 'de-DE';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add('listening');
    statusEl.textContent = 'Ich höre zu...';
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
    if (statusEl.textContent === 'Ich höre zu...') statusEl.textContent = 'Bereit';
  };

  recognition.onerror = (event) => {
    statusEl.textContent = 'Fehler: ' + event.error;
  };

  recognition.onresult = async (event) => {
    const text = event.results[0][0].transcript;
    await processInput(text);
  };

  micBtn.addEventListener('click', () => {
    if (listening) {
      recognition.stop();
    } else {
      window.speechSynthesis.cancel();
      recognition.start();
    }
  });
}

// Textfeld-Eingabe
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');

function submitTextInput() {
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = '';
  processInput(text);
}

sendBtn.addEventListener('click', submitTextInput);
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitTextInput();
});
</script>

</body>
</html>
