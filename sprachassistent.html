<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprachassistent</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
  }
  .card {
    width: 420px;
    max-width: 92vw;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  p.subtitle { opacity: 0.7; font-size: 0.85rem; margin-top: 0; }

  .mic-btn {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    cursor: pointer;
    margin: 20px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 0 0 rgba(139,92,246,0.6);
  }
  .mic-btn:hover { transform: scale(1.05); }
  .mic-btn.listening {
    animation: pulse 1.4s infinite;
    background: linear-gradient(135deg, #ef4444, #f97316);
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
    70% { box-shadow: 0 0 0 20px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }

  .status { font-size: 0.85rem; opacity: 0.8; min-height: 20px; margin-bottom: 10px; }

  .log {
    text-align: left;
    max-height: 260px;
    overflow-y: auto;
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    padding: 12px;
    font-size: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    padding: 8px 12px;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.35;
  }
  .user {
    align-self: flex-end;
    background: #6366f1;
    border-bottom-right-radius: 2px;
  }
  .assistant {
    align-self: flex-start;
    background: rgba(255,255,255,0.15);
    border-bottom-left-radius: 2px;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

  .hint { font-size: 0.75rem; opacity: 0.5; margin-top: 14px; }
</style>
</head>
<body>

<div class="card">
  <h1>🎙️ Sprachassistent</h1>
  <p class="subtitle">Klicke aufs Mikrofon und sprich einen Befehl</p>

  <button class="mic-btn" id="micBtn">🎤</button>
  <div class="status" id="status">Bereit</div>

  <div class="log" id="log"></div>

  <div class="hint">Beispiele: "Wie spät ist es?", "Wie ist das Wetter?", "Erzähl einen Witz", "Was ist 12 mal 8?"</div>
</div>

<script>
const micBtn = document.getElementById('micBtn');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

function addBubble(text, who) {
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function speak(text) {
  addBubble(text, 'assistant');
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'de-DE';
  utter.rate = 1;
  window.speechSynthesis.speak(utter);
}

// Einfache Befehlslogik – hier kannst du beliebig erweitern
function handleCommand(text) {
  const t = text.toLowerCase();

  if (t.includes('wie spät') || t.includes('uhrzeit')) {
    const now = new Date();
    const zeit = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    speak(`Es ist ${zeit} Uhr.`);
  } else if (t.includes('datum') || t.includes('welcher tag')) {
    const now = new Date();
    const datum = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    speak(`Heute ist ${datum}.`);
  } else if (t.includes('witz')) {
    const witze = [
      'Warum können Skelette so schlecht lügen? Weil man ihnen durchsehen kann.',
      'Sagt der Lehrer: Nenne mir ein Wort mit „nicht“ am Anfang und Ende. Antwortet der Schüler: Nichts.',
      'Was ist grün und hüpft durch den Wald? Ein Frosch. Ich weiß, war nicht schwer.'
    ];
    speak(witze[Math.floor(Math.random() * witze.length)]);
  } else if (t.match(/was ist \d+ (mal|plus|minus|geteilt durch) \d+/)) {
    const match = t.match(/was ist (\d+) (mal|plus|minus|geteilt durch) (\d+)/);
    if (match) {
      const a = parseFloat(match[1]);
      const op = match[2];
      const b = parseFloat(match[3]);
      let result;
      if (op === 'mal') result = a * b;
      if (op === 'plus') result = a + b;
      if (op === 'minus') result = a - b;
      if (op === 'geteilt durch') result = a / b;
      speak(`Das Ergebnis ist ${result}.`);
    } else {
      speak('Das habe ich nicht ganz verstanden.');
    }
  } else if (t.includes('wetter')) {
    speak('Ich habe leider keinen Zugriff auf Live-Wetterdaten, aber das ließe sich mit einer Wetter-API ergänzen.');
  } else if (t.includes('wie heißt du') || t.includes('wer bist du')) {
    speak('Ich bin dein kleiner Sprachassistent, gebaut mit HTML und JavaScript.');
  } else if (t.includes('danke')) {
    speak('Gerne!');
  } else {
    speak('Das habe ich leider nicht verstanden. Du kannst mich zum Beispiel nach der Uhrzeit fragen.');
  }
}

if (!SpeechRecognition) {
  statusEl.textContent = 'Spracherkennung wird von diesem Browser nicht unterstützt (am besten Chrome nutzen).';
  micBtn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = 'de-DE';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add('listening');
    statusEl.textContent = 'Ich höre zu...';
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
    statusEl.textContent = 'Bereit';
  };

  recognition.onerror = (event) => {
    statusEl.textContent = 'Fehler: ' + event.error;
  };

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    addBubble(text, 'user');
    statusEl.textContent = 'Verarbeite...';
    handleCommand(text);
  };

  micBtn.addEventListener('click', () => {
    if (listening) {
      recognition.stop();
    } else {
      window.speechSynthesis.cancel();
      recognition.start();
    }
  });
}
</script>

</body>
</html>
